# V1 dependency set per ENGINEERING_SPEC.md Appendix A — nothing speculative.
[versions]
agp = "9.2.1"
kotlin = "2.3.21"
ksp = "2.3.9"
hilt = "2.59.2"
hiltNavigationCompose = "1.3.0"
composeBom = "2026.05.01"
coreKtx = "1.19.0"
activityCompose = "1.13.0"
lifecycle = "2.10.0"
navigationCompose = "2.9.8"
room = "2.8.4"
datastore = "1.2.1"
serializationJson = "1.9.0"
browser = "1.10.0"
composeMaterialIconsCore = "1.7.8"
glance = "1.1.1"
# --- iOS port, release 1.9.0 (docs/dependency-contract.md §3.3, §3.5) -----------------
# Added as coordinates only; call sites are converted by p1-02…p1-05. Every version below
# was probed against the real repository on 2026-08-08 and resolves for android + iosArm64 +
# iosSimulatorArm64, so nothing here has to move again when the shared modules land.
kotlinxDatetime = "0.8.0"  # NOT 0.7.0 — Gate 0 M1/M3 pinned 0.8.0; it has kotlinx.datetime.YearMonth
okio = "3.18.1"            # bump, not a new stack: okio 3.9.1 already ships via datastore-core-okio
ktor = "3.5.2"
assertk = "0.28.1"         # newest published; replaces Truth once p1-05 clears the call sites (R1)
# --------------------------------------------------------------------------------------
junit = "4.13.2"
# 1.10.2 -> 1.11.0: FORCED by ktor-client-core 3.5.2, which requires coroutines-core 1.11.0.
# coroutines-test reaches into core internals and must track it (dependency-contract §3.5).
# This also closes a pre-existing skew: the app shipped 1.9.0 while testing against 1.10.2.
coroutinesTest = "1.11.0"
turbine = "1.2.1"
truth = "1.4.4"  # R1: removed in the LAST commit of 1.9.0, after p1-05 clears 1,444 call sites
robolectric = "4.15.1"
sqliteJdbc = "3.50.1.0"
kover = "0.9.8"
spotless = "7.0.4"
appUpdate = "2.1.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core", version.ref = "composeMaterialIconsCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }
# --- iOS port, release 1.9.0 ----------------------------------------------------------
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinxDatetime" }
okio = { group = "com.squareup.okio", name = "okio", version.ref = "okio" }
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
# R3: the Android engine is ktor-client-android, NOT ktor-client-okhttp. See app/build.gradle.kts.
ktor-client-android = { group = "io.ktor", name = "ktor-client-android", version.ref = "ktor" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }
assertk = { group = "com.willowtreeapps.assertk", name = "assertk", version.ref = "assertk" }
# ktor-client-darwin is deliberately absent: no iOS target exists in this build yet, so an
# entry here would never be resolved and never verified. It lands with p2-09.
# --------------------------------------------------------------------------------------
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }
play-app-update = { group = "com.google.android.play", name = "app-update", version.ref = "appUpdate" }
play-app-update-ktx = { group = "com.google.android.play", name = "app-update-ktx", version.ref = "appUpdate" }
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
androidx-glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }
androidx-glance-appwidget-testing = { group = "androidx.glance", name = "glance-appwidget-testing", version.ref = "glance" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqliteJdbc" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-navigation-testing = { group = "androidx.navigation", name = "navigation-testing", version.ref = "navigationCompose" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
