name: Assign build to a Play track

# Puts an ALREADY-UPLOADED build (identified by versionCode) onto a Play track, without
# rebuilding, re-signing, or moving it off any other track.
#
# ── How this differs from "Promote to Production" ─────────────────────────────────────────
# promote-production.yml uses `supply --track_promote_to`, which PROMOTES a release: it moves
# the release from the source track to the target. That is right for alpha → production, but
# it is the wrong tool for "also put it on internal", because promoting FROM production could
# take a live release OFF production.
#
# This workflow is ADDITIVE: it sets the target track's release to the given versionCode and
# touches nothing else. Use it to seed a testing track with a build that already exists in
# Play (e.g. putting the current production hotfix in front of internal testers).
#
# Note: a versionCode can only ever be uploaded ONCE, so re-running release.yml is not an
# option for an existing build — assigning the existing bundle is the only route.
#
# ── PREREQUISITE ──────────────────────────────────────────────────────────────────────────
# The Play Developer API cannot create the FIRST release on a track that has never had one
# (see docs/RELEASING.md). If the target track is empty, this fails with a permission-shaped
# error and the owner must make one release on that track manually in the Play Console first.
# ──────────────────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode to assign (must already exist in Play)"
        required: true
        default: "10701"
      source_track:
        description: "Track the build is on NOW (stays active — not deactivated)"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - alpha
          - beta
          - internal
      target_track:
        description: "Track to assign it TO"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
      validate_only:
        description: "Dry run — validate with Play and commit NOTHING (run this first)"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: assign-track
  cancel-in-progress: false

jobs:
  assign:
    name: Assign ${{ github.event.inputs.version_code }} → ${{ github.event.inputs.target_track }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Write service account key
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > play-service-account.json

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      # Pinned for the same reason as promote-production.yml: an unpinned `gem install fastlane`
      # is a floating dependency in a workflow that holds the Play publishing credential.
      - name: Install Fastlane
        run: gem install fastlane --no-document --version 2.237.0

      - name: Assign to track
        run: |
          echo "Assigning versionCode ${{ github.event.inputs.version_code }} from ${{ github.event.inputs.source_track }} to ${{ github.event.inputs.target_track }} (validate_only=${{ github.event.inputs.validate_only }})"
          # WHY THIS SHAPE — two dead ends were tried first and are recorded so they are not retried:
          #
          #   1. `--track <target> --version_code N` with every --skip_upload_* and NO promotion:
          #      supply exits with "No local metadata, apks, aab, or track to promote were found".
          #      With nothing to upload and nothing to promote it considers itself a no-op.
          #   2. Adding `--rollout` to that: sends supply down its update_rollout path, which
          #      UPDATES an existing release — "Unable to find the requested release on track"
          #      when the target track has none.
          #
          # So `--track_promote_to` is the only working route. The danger is that supply's
          # `deactivate_on_promote` defaults to TRUE, which would DEACTIVATE the source release —
          # with production as the source that would pull a live release off production. It is
          # therefore pinned FALSE below: the source track keeps its release and the build simply
          # also appears on the target. Play allows one versionCode to be live on several tracks.
          #
          # --validate_only runs Play's validation and commits nothing; run that first.
          fastlane supply \
            --package_name com.jpillion.dailyreadingplanner \
            --json_key play-service-account.json \
            --track "${{ github.event.inputs.source_track }}" \
            --track_promote_to "${{ github.event.inputs.target_track }}" \
            --version_code "${{ github.event.inputs.version_code }}" \
            --release_status completed \
            --deactivate_on_promote false \
            --validate_only "${{ github.event.inputs.validate_only }}" \
            --skip_upload_apk true \
            --skip_upload_aab true \
            --skip_upload_metadata true \
            --skip_upload_images true \
            --skip_upload_screenshots true \
            --skip_upload_changelogs true \
            --verbose

      - name: Clean up service account key
        if: always()
        run: rm -f play-service-account.json
